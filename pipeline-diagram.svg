<svg width="680" height="520" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>/review-pr automated pipeline</title>
<desc>Flowchart showing the /review-pr command loading project context, fetching a PR diff, delegating to two subagents in parallel, then synthesizing their findings into one report.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="520" fill="#ffffff"/>

<line x1="340" y1="84" x2="340" y2="124" stroke="#5f5e5a" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="180" x2="340" y2="220" stroke="#5f5e5a" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M340 276 L340 296" fill="none" stroke="#5f5e5a" stroke-width="0.5"/>
<path d="M340 296 L180 296 L180 316" fill="none" stroke="#5f5e5a" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M340 296 L500 296 L500 316" fill="none" stroke="#5f5e5a" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M180 372 L180 392 L340 392" fill="none" stroke="#5f5e5a" stroke-width="0.5"/>
<path d="M500 372 L500 392 L340 392" fill="none" stroke="#5f5e5a" stroke-width="0.5"/>
<line x1="340" y1="392" x2="340" y2="412" stroke="#5f5e5a" stroke-width="1" marker-end="url(#arrow)"/>

<g>
<rect x="240" y="40" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="62" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">/review-pr</text>
</g>

<g>
<rect x="220" y="124" width="240" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="144" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Load CLAUDE.md</text>
<text x="340" y="164" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">Project conventions &amp; limits</text>
</g>

<g>
<rect x="240" y="220" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="240" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Fetch PR diff</text>
<text x="340" y="260" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">via gh pr diff</text>
</g>

<g>
<rect x="80" y="316" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="180" y="336" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">code-reviewer</text>
<text x="180" y="356" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">Fresh-eyes code review</text>
</g>

<g>
<rect x="400" y="316" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="500" y="336" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">test-engineer</text>
<text x="500" y="356" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">Checks test coverage</text>
</g>

<g>
<rect x="240" y="412" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="432" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Synthesize findings</text>
<text x="340" y="452" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">One unified report</text>
</g>

<text x="340" y="495" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Blue = sequential setup &#183; Purple = parallel subagent review</text>
</svg>
