<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URL Shortener</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f4f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #1f2328;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 480px;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    padding: 32px;
  }

  h1 {
    margin: 0 0 4px;
    font-size: 22px;
  }

  .subtitle {
    margin: 0 0 24px;
    color: #6b7280;
    font-size: 14px;
  }

  form {
    display: flex;
    gap: 8px;
  }

  input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    font-size: 14px;
    border: 1px solid #d0d5dd;
    border-radius: 8px;
    outline: none;
    min-width: 0;
  }

  input[type="text"]:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
  }

  button {
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    background: #6366f1;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
  }

  button:hover:not(:disabled) {
    background: #4f46e5;
  }

  button:disabled {
    background: #a5a6f6;
    cursor: not-allowed;
  }

  .error-message {
    display: none;
    margin-top: 12px;
    padding: 10px 12px;
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #b91c1c;
    border-radius: 8px;
    font-size: 13px;
  }

  .error-message.visible {
    display: block;
  }

  .result {
    display: none;
    margin-top: 20px;
    padding: 14px;
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    border-radius: 8px;
  }

  .result.visible {
    display: block;
  }

  .result-label {
    margin: 0 0 6px;
    font-size: 12px;
    color: #15803d;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .result-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .short-url {
    flex: 1;
    min-width: 0;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 14px;
    color: #14532d;
    overflow-wrap: break-word;
    text-decoration: none;
  }

  .copy-btn {
    background: #16a34a;
    padding: 8px 14px;
    font-size: 13px;
  }

  .copy-btn:hover:not(:disabled) {
    background: #15803d;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>URL Shortener</h1>
    <p class="subtitle">Paste a long URL below to get a short link.</p>

    <form id="shorten-form">
      <input type="text" id="url-input" placeholder="https://example.com/some/long/path" autocomplete="off">
      <button type="submit" id="submit-btn">Shorten</button>
    </form>

    <div class="error-message" id="error-message"></div>

    <div class="result" id="result">
      <p class="result-label">Your short URL</p>
      <div class="result-row">
        <a class="short-url" id="short-url" href="#" target="_blank" rel="noopener"></a>
        <button type="button" class="copy-btn" id="copy-btn">Copy</button>
      </div>
    </div>
  </div>

<script>
  const API_BASE = "http://127.0.0.1:8000";

  const form = document.getElementById("shorten-form");
  const input = document.getElementById("url-input");
  const submitBtn = document.getElementById("submit-btn");
  const errorEl = document.getElementById("error-message");
  const resultEl = document.getElementById("result");
  const shortUrlEl = document.getElementById("short-url");
  const copyBtn = document.getElementById("copy-btn");

  function showError(message) {
    errorEl.textContent = message;
    errorEl.classList.add("visible");
  }

  function hideError() {
    errorEl.textContent = "";
    errorEl.classList.remove("visible");
  }

  function showResult(shortUrl) {
    shortUrlEl.textContent = shortUrl;
    shortUrlEl.href = shortUrl;
    resultEl.classList.add("visible");
  }

  function hideResult() {
    resultEl.classList.remove("visible");
  }

  async function friendlyErrorFromResponse(res) {
    try {
      const body = await res.json();
      if (Array.isArray(body.detail)) {
        return "That doesn't look like a valid URL. Make sure it starts with http:// or https://.";
      }
      if (typeof body.detail === "string") {
        return body.detail;
      }
    } catch (e) {
      // fall through to generic message
    }
    return "Something went wrong. Please try again.";
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    hideError();
    hideResult();

    const url = input.value.trim();
    if (!url) {
      showError("Please enter a URL.");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Shortening…";

    try {
      const res = await fetch(`${API_BASE}/shorten`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ original_url: url }),
      });

      if (!res.ok) {
        showError(await friendlyErrorFromResponse(res));
        return;
      }

      const data = await res.json();
      showResult(data.short_url);
    } catch (err) {
      showError("Something went wrong. Please try again.");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Shorten";
    }
  });

  copyBtn.addEventListener("click", async () => {
    const text = shortUrlEl.textContent;
    if (!text) return;
    try {
      await navigator.clipboard.writeText(text);
      const original = copyBtn.textContent;
      copyBtn.textContent = "Copied!";
      copyBtn.disabled = true;
      setTimeout(() => {
        copyBtn.textContent = original;
        copyBtn.disabled = false;
      }, 1500);
    } catch (err) {
      showError("Couldn't copy to clipboard. Please copy the URL manually.");
    }
  });
</script>
</body>
</html>
